<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 5. Contact Management System
    Inputs
    Name
    Mobile Number
    Email
    Address
    Buttons
    Add Contact
    Update Contact
    Delete Contact
    Search Contact
    
    Table
    | Name | Mobile | Email | Address | Action | -->

    <form>
        <label>Name</label>
        <input type="text" id="name">
        <label>Mobile Number</label>
        <input type="number" id="mobile">
        <label>Email</label>
        <input type="email" id="email">
        <label>Address</label>
        <input type="text" id="address">

        <button type="submit" id="btn" onclick="addContact(event)">Add Contact</button>
    </form>
    <br>
    <table border="2" cellpadding="8" width="600">
        <thead>
            <th>Name</th>
            <th>Mobile</th>
            <th>Email</th>
            <th>Address</th>
            <th>Action</th>
        </thead>
        <tbody id="contTable">

        </tbody>
    </table>

    <script src="cont.js"></script>
</body>
</html>
