<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
</head>

<body>
    <!-- 2. Employee Management System
    Inputs
    Employee Name
    Employee ID
    Department
    Salary
    Buttons
    Add Employee
    Update Employee
    Delete Employee -->
    <form>
        <label for="empName">Employee Name</label>
        <input type="text" id="empName" placeholder="Employee Name">
        <label for="id">Employee ID</label>
        <input type="number" id="empId" placeholder="Employee ID">

        <select id="dept" class="border p-2 rounded w-full">
            <option value="">-- Select Department --</option>
            <option value="Human Resources">Human Resources (HR)</option>
            <option value="Information Technology">Information Technology (IT)</option>
            <option value="Finance">Finance</option>
            <option value="Marketing">Marketing</option>
            <option value="Sales">Sales</option>
            <option value="Operations">Operations</option>
            <option value="Customer Support">Customer Support</option>
            <option value="Administration">Administration</option>
            <option value="Research & Development">Research & Development (R&D)</option>
            <option value="Production">Production</option>
            <option value="Quality Assurance">Quality Assurance (QA)</option>
            <option value="Purchase">Purchase</option>
            <option value="Logistics">Logistics</option>
            <option value="Legal">Legal</option>
        </select>
        <label for="salary">Salary</label>
        <input type="number" id="salary" placeholder="Salary in Rupees">

        <button type="submit" onclick="addEmp(event)" id="btn">Add</button>

    </form>
    <br>
    <table border="2" cellpadding="8" width="600" bgcolor="skyblue">
        <thead>
            <th>Employee Name</th>
            <th>Employee ID</th>
            <th>Department</th>
            <th>Salary</th>
            <th>Action</th>
        </thead>
        <tbody id="emptable">

        </tbody>
    </table>

    <script src="emp.js"></script>
</body>

</html>
