<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1 style=" font-size: 32px; margin-bottom: 8px;">BookVerse</h1>
        <p style=" font-size: 14px;">Read, Dream, Explore - Your Favorite Bookstore</p>
    </header>

    <section class="container">
        <h2 style=" margin-bottom: 20px; font-size: 28px;">Featured Books</h2>

        <div class="box">
            <div class="box-card">
                <h3>Atomic Habits</h3>
                <p>by James Clear</p>
                <span>₹499</span>
            </div>
            <div class="box-card">
                <h3>The Alchemist</h3>
                <p>by Paulo Coelho</p>
                <span>₹399</span>
            </div>
        </div>
        <div class="box-card" style="width: 100%;">
            <h3>Rich Dad Poor Dad</h3>
            <p>by Robert Kiyosaki</p>
            <span>₹450</span>
        </div>
    </section>

    <section class="container">
        <h2>Order a Book</h2>
        <form>
            <input type="text" placeholder="Your Name">
            <input type="email" placeholder="Your Email">
            <textarea placeholder="Book Name & Delivery Address" style=" height: 100px; resize: none;"></textarea>
            <button type="submit">Place Order</button>
        </form>
    </section>

    <footer>
        © 2025 BookVerse. All Rights Reserved.
    </footer>

</body>

</html>
